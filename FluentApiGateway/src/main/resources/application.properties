spring.application.name=FluentApiGateway

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# Server setup
server.port=${API_GATEWAY_PORT:8000}
video.storage.location=${VIDEO_STORAGE_PATH}

# Database setup
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Microservices configuration
#hand.detection.service.url=${HAND_DETECTION_SERVICE}:${HAND_DETECTION_SERVICE_PORT}/api
video.analysis.service.url=${VIDEO_ANALYSIS_SERVICE_URL:http://localhost:8001}
audio.analysis.service.url=${AUDIO_ANALYSIS_SERVICE_URL:http://localhost:8004}

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fluent_timescaledb
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: always
    env_file:
      - .env

volumes:
  timescale-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /d/TimescaleData
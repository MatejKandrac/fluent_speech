services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fluent_timescaledb
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - fluent-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./FluentApiGateway
    container_name: fluent_api_gateway
    ports:
      - '${API_GATEWAY_PORT}:8000'
    env_file:
      - .env
    volumes:
      - video-data:/app/video_data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  video-analysis:
    build: processing/video_processing_ms
    container_name: fluent_video_analysis
    ports:
      - '${VIDEO_ANALYSIS_PORT}:8001'
    env_file:
      - .env
    volumes:
      - video-data:/app/video_data
      - video-debug:/app/debug_output
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  audio-analysis:
    build: processing/audio_processing_ms
    container_name: fluent_audio_analysis
    ports:
      - '${AUDIO_ANALYSIS_PORT}:8004'
    env_file:
      - .env
    volumes:
      - video-data:/app/video_data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  pitch-analysis:
    build: analysis/pitch_analysis_ms
    container_name: fluent_pitch_analysis
    ports:
      - '${PITCH_ANALYSIS_PORT}:8005'
    env_file:
      - .env
    volumes:
      - video-data:/app/video_data
      - pitch-debug:/app/debug
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  volume-analysis:
    build: analysis/volume_analysis_ms
    container_name: fluent_volume_analysis
    ports:
      - '${VOLUME_ANALYSIS_PORT}:8006'
    env_file:
      - .env
    volumes:
      - video-data:/app/video_data
      - volume-debug:/app/debug
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  hip-analysis:
    build: analysis/hip_analysis_ms
    container_name: fluent_hip_analysis
    ports:
      - '${HIP_ANALYSIS_PORT}:8007'
    env_file:
      - .env
    volumes:
      - hip-debug:/app/debug
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  arm-movement:
    build: analysis/arm_movement_analysis_ms
    container_name: fluent_arm_movement
    ports:
      - '${ARM_MOVEMENT_PORT}:8002'
    env_file:
      - .env
    volumes:
      - arm-debug:/app/debug_output
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  eye-contact:
    build: analysis/eye_contact_analysis_ms
    container_name: fluent_eye_contact
    ports:
      - '${EYE_CONTACT_PORT}:8003'
    env_file:
      - .env
    volumes:
      - eye-debug:/app/debug_output
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  filler_words:
    build: analysis/filler_words_analysis_ms
    container_name: fluent_filler_words
    ports:
      - '${FILLER_WORDS_PORT}:8008'
    env_file:
      - .env
    volumes:
      - filler-words-debug:/app/debug_output
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  performance-ms:
    build: analysis/performance_ms
    container_name: fluent_performance_ms
    ports:
      - '${PERFORMANCE_MS_PORT}:8010'
    env_file:
      - .env
    networks:
      - fluent-network
    restart: unless-stopped

  analysis-orchestrator:
    build: analysis/analysis_orchestrator_ms
    container_name: fluent_analysis_orchestrator
    ports:
      - '${ORCHERSTRATOR_PORT}:8010'
    env_file:
      - .env
    depends_on:
      - arm-movement
      - eye-contact
      - pitch-analysis
      - volume-analysis
      - hip-analysis
      - filler_words
      - performance-ms
    networks:
      - fluent-network
    restart: unless-stopped

  processing-orchestrator:
    build: processing/processing_orchestrator_ms
    container_name: fluent_processing_orchestrator
    ports:
      - '${PROCESSING_ORCHESTRATOR_PORT}:8010'
    env_file:
      - .env
    volumes:
      - video-data:/app/video_data
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  transcript_service:
    build: processing/transcript_processing_ms
    container_name: transcript_service
    ports:
      - '${TRANSCRIPT_SERVICE_PORT}:8009'
    env_file:
      - .env
    volumes:
      - transcript-debug:/app/debug_output
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  segmentation:
    build: analysis/segmentation_ms
    container_name: fluent_segmentation
    ports:
      - '${SEGMENTATION_ANALYSIS_PORT}:8010'
    env_file:
      - .env
    networks:
      - fluent-network
    restart: unless-stopped

networks:
  fluent-network:
    driver: bridge

volumes:
  timescale-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: D:/TimescaleData

  video-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: D:/VideoData

  video-debug:
  pitch-debug:
  volume-debug:
  hip-debug:
  arm-debug:
  eye-debug:
  filler-words-debug:
  transcript-debug:
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fluent_timescaledb
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - fluent-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./FluentApiGateway
    container_name: fluent_api_gateway
    ports:
      - '${API_GATEWAY_PORT}:8000'
    env_file:
      - .env
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  video-analysis:
    build: ./video_analysis_ms
    container_name: fluent_video_analysis
    ports:
      - '${VIDEO_ANALYSIS_PORT}:8001'
    env_file:
      - .env
    volumes:
      - video-data:/app/video_data
      - video-debug:/app/debug_output
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  audio-analysis:
    build: ./audio_analysis_ms
    container_name: fluent_audio_analysis
    ports:
      - '${AUDIO_ANALYSIS_PORT}:8004'
    env_file:
      - .env
    volumes:
      - video-data:/app/video_data
      - audio-debug:/app/debug_output
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  arm-movement:
    build: ./arm_movement_analysis_ms
    container_name: fluent_arm_movement
    ports:
      - '${ARM_MOVEMENT_PORT}:8002'
    env_file:
      - .env
    volumes:
      - arm-debug:/app/debug_output
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

  eye-contact:
    build: ./eye_contact_analysis_ms
    container_name: fluent_eye_contact
    ports:
      - '${EYE_CONTACT_PORT}:8003'
    env_file:
      - .env
    volumes:
      - eye-debug:/app/debug_output
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - fluent-network
    restart: unless-stopped

networks:
  fluent-network:
    driver: bridge

volumes:
  timescale-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: D:/TimescaleData

  video-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: D:/VideoData

  video-debug:
  audio-debug:
  arm-debug:
  eye-debug: